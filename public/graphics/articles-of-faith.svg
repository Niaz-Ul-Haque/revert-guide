<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 661" role="img" aria-labelledby="title desc" lang="en"><title id="title">What Muslims believe (Iman)</title><desc id="desc">Six tiles. 1 Allah: the One God, with no partner. 2 The angels: created beings who serve Allah. 3 The revealed books: including the Quran, the final revelation. 4 The messengers: from Adam to Muhammad, the final messenger. 5 The Last Day: everyone will be raised and held to account. 6 Divine decree (Qadar): nothing happens outside Allah's knowledge and will, the good and the hard. Sources: Sahih Muslim 8a; Quran 2:285.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="661" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="659.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">What Muslims believe (Iman)</text><text class="s" x="24" y="81"><tspan x="24" dy="0">The six articles of faith, in the order of the</tspan><tspan x="24" dy="19">hadith of Jibril.</tspan></text><rect x="24" y="135" width="372" height="61" rx="12" fill="#EDF4EB"/><path d="M36 184 V160.5 Q36 149.25 51.0 147 Q66 149.25 66 160.5 V184 Z" fill="#4A7C59"/><text class="n" x="51" y="174.5" text-anchor="middle">1</text><text class="bb" x="82" y="161">Allah</text><text class="s" x="82" y="182">The One God, with no partner.</text><rect x="24" y="206" width="372" height="61" rx="12" fill="#EDF4EB"/><path d="M36 255 V231.5 Q36 220.25 51.0 218 Q66 220.25 66 231.5 V255 Z" fill="#4A7C59"/><text class="n" x="51" y="245.5" text-anchor="middle">2</text><text class="bb" x="82" y="232">The angels</text><text class="s" x="82" y="253">Created beings who serve Allah.</text><rect x="24" y="277" width="372" height="61" rx="12" fill="#EDF4EB"/><path d="M36 326 V302.5 Q36 291.25 51.0 289 Q66 291.25 66 302.5 V326 Z" fill="#4A7C59"/><text class="n" x="51" y="316.5" text-anchor="middle">3</text><text class="bb" x="82" y="303">The revealed books</text><text class="s" x="82" y="324">Including the Quran, the final revelation.</text><rect x="24" y="348" width="372" height="80" rx="12" fill="#EDF4EB"/><path d="M36 416 V373.5 Q36 362.25 51.0 360 Q66 362.25 66 373.5 V416 Z" fill="#4A7C59"/><text class="n" x="51" y="397.0" text-anchor="middle">4</text><text class="bb" x="82" y="374">The messengers</text><text class="s" x="82" y="395"><tspan x="82" dy="0">From Adam to Muhammad, the final</tspan><tspan x="82" dy="19">messenger.</tspan></text><rect x="24" y="438" width="372" height="80" rx="12" fill="#EDF4EB"/><path d="M36 506 V463.5 Q36 452.25 51.0 450 Q66 452.25 66 463.5 V506 Z" fill="#4A7C59"/><text class="n" x="51" y="487.0" text-anchor="middle">5</text><text class="bb" x="82" y="464">The Last Day</text><text class="s" x="82" y="485"><tspan x="82" dy="0">Everyone will be raised and held to</tspan><tspan x="82" dy="19">account.</tspan></text><rect x="24" y="528" width="372" height="80" rx="12" fill="#EDF4EB"/><path d="M36 596 V553.5 Q36 542.25 51.0 540 Q66 542.25 66 553.5 V596 Z" fill="#4A7C59"/><text class="n" x="51" y="577.0" text-anchor="middle">6</text><text class="bb" x="82" y="554">Divine decree (Qadar)</text><text class="s" x="82" y="575"><tspan x="82" dy="0">Nothing happens outside Allah's knowledge</tspan><tspan x="82" dy="19">and will, the good and the hard.</tspan></text><text class="s" x="24" y="634">Sahih Muslim 8a; Quran 2:285</text></svg>
