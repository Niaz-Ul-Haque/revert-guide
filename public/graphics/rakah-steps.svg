<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1161" role="img" aria-labelledby="title desc" lang="en"><title id="title">One unit of prayer (rak'ah), step by step</title><desc id="desc">Seven faceless figures. 1 Stand, raise your hands: Allahu akbar, Allah is the Greatest. 2 Stand and recite Al-Fatihah, then a short surah in the first two rak'ahs. 3 Bow (ruku): Subhana Rabbiyal-'Azim, glory be to my Lord, the Most Great. 4 Rise: Sami'a Allahu liman hamidah, then Rabbana wa lakal-hamd, Allah hears the one who praises Him, our Lord, to You belongs all praise. 5 Prostrate (sujud): Subhana Rabbiyal-A'la, glory be to my Lord, the Most High. 6 Sit up: Rabbighfir li, my Lord, forgive me. 7 Prostrate again with the same words.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="1161" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="1159.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">One unit of prayer (rak'ah)</text><text class="s" x="24" y="81"><tspan x="24" dy="0">Seven positions, each with its words. Move calmly</tspan><tspan x="24" dy="19">and pause in each one.</tspan></text><rect x="24" y="129" width="372" height="116" rx="12" fill="#EDF4EB"/><rect x="24" y="129" width="372" height="116" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 151.0) scale(0.82)"><circle cx="40" cy="12" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M40 24V56M40 56L34 84M40 56L46 84M40 30L28 36L28 18M40 30L52 36L52 18"/></g><text class="bb" x="116" y="149">1. Stand and raise your hands</text><text class="ar" x="256.0" y="183" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">اللَّهُ أَكْبَرُ</text><text class="b i" x="116" y="205" style="font-size:15px">Allahu akbar</text><text class="s" x="116" y="226">Allah is the Greatest.</text><rect x="24" y="253" width="372" height="96" rx="12" fill="#F7FAF6"/><rect x="24" y="253" width="372" height="96" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 265.0) scale(0.82)"><circle cx="40" cy="12" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M40 24V56L40 84H48M40 30L35 42H47"/></g><text class="bb" x="116" y="273">2. Stand and recite</text><text class="s" x="116" y="295"><tspan x="116" dy="0">Al-Fatihah, then a short surah in the</tspan><tspan x="116" dy="19">first two rak'ahs.</tspan></text><rect x="24" y="357" width="372" height="116" rx="12" fill="#EDF4EB"/><rect x="24" y="357" width="372" height="116" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 379.0) scale(0.82)"><circle cx="71" cy="46" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M30 84H38M30 84V52H62M56 52L33 68"/></g><text class="bb" x="116" y="377">3. Bow (ruku)</text><text class="ar" x="256.0" y="411" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">سُبْحَانَ رَبِّيَ الْعَظِيمِ</text><text class="b i" x="116" y="433" style="font-size:15px">Subhana Rabbiyal-'Azim</text><text class="s" x="116" y="454">Glory be to my Lord, the Most Great.</text><rect x="24" y="481" width="372" height="184" rx="12" fill="#F7FAF6"/><rect x="24" y="481" width="372" height="184" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 537.0) scale(0.82)"><circle cx="40" cy="12" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M40 24V56L40 84H48M40 30L41 55"/></g><text class="bb" x="116" y="501">4. Rise and stand straight</text><text class="ar" x="256.0" y="535" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ</text><text class="ar" x="256.0" y="565" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">رَبَّنَا وَلَكَ الْحَمْدُ</text><text class="b i" x="116" y="587" style="font-size:15px"><tspan x="116" dy="0">Sami'a Allahu liman hamidah, then</tspan><tspan x="116" dy="19">Rabbana wa lakal-hamd</tspan></text><text class="s" x="116" y="627"><tspan x="116" dy="0">Allah hears the one who praises Him.</tspan><tspan x="116" dy="19">Our Lord, to You belongs all praise.</tspan></text><rect x="24" y="673" width="372" height="116" rx="12" fill="#EDF4EB"/><rect x="24" y="673" width="372" height="116" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 695.0) scale(0.82)"><circle cx="68" cy="76" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M12 84H36L40 62L60 72M56 70L62 84H70"/></g><text class="bb" x="116" y="693">5. Prostrate (sujud)</text><text class="ar" x="256.0" y="727" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">سُبْحَانَ رَبِّيَ الْأَعْلَى</text><text class="b i" x="116" y="749" style="font-size:15px">Subhana Rabbiyal-A'la</text><text class="s" x="116" y="770">Glory be to my Lord, the Most High.</text><rect x="24" y="797" width="372" height="116" rx="12" fill="#F7FAF6"/><rect x="24" y="797" width="372" height="116" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 819.0) scale(0.82)"><circle cx="30" cy="34" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M20 84H48M24 78L28 46M28 52L42 72"/></g><text class="bb" x="116" y="817">6. Sit up between prostrations</text><text class="ar" x="256.0" y="851" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">رَبِّ اغْفِرْ لِي</text><text class="b i" x="116" y="873" style="font-size:15px">Rabbighfir li</text><text class="s" x="116" y="894">My Lord, forgive me.</text><rect x="24" y="921" width="372" height="96" rx="12" fill="#EDF4EB"/><rect x="24" y="921" width="372" height="96" rx="12" fill="none" stroke="#C5D4C1" stroke-width="1"/><g transform="translate(34 933.0) scale(0.82)"><circle cx="68" cy="76" r="8" fill="#4A7C59"/><path fill="none" stroke="#4A7C59" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M12 84H36L40 62L60 72M56 70L62 84H70"/></g><text class="bb" x="116" y="941">7. Prostrate again</text><text class="s" x="116" y="963"><tspan x="116" dy="0">The same words as the first</tspan><tspan x="116" dy="19">prostration.</tspan></text><text class="b" x="24" y="1043"><tspan x="24" dy="0">That is one rak'ah. Stand for the next one,</tspan><tspan x="24" dy="22">or sit for the tashahhud (see the rak'ah</tspan><tspan x="24" dy="22">map).</tspan></text><text class="s" x="24" y="1113"><tspan x="24" dy="0">Hand position while standing differs between</tspan><tspan x="24" dy="19">schools. All are valid.</tspan></text></svg>
