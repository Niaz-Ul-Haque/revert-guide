<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 841" role="img" aria-labelledby="title desc" lang="en"><title id="title">The five daily prayers across the day</title><desc id="desc">A day from night to night. Fajr (dawn prayer), 2 units: from the first light of dawn until sunrise. Sunrise: no prayer window. Dhuhr (midday prayer), 4 units: from just after midday until Asr begins. Asr (afternoon prayer), 4 units: from mid-afternoon until the sun turns yellow. Maghrib (sunset prayer), 3 units: from just after sunset until the twilight glow is gone. Isha (night prayer), 4 units: after the twilight has gone, best before the middle of the night. Exact times change daily and by city.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="841" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="839.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">The five daily prayers</text><text class="s" x="24" y="81"><tspan x="24" dy="0">Each prayer has a window of time. Where it falls</tspan><tspan x="24" dy="19">moves with the sun.</tspan></text><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2E1A"/><stop offset="0.14" stop-color="#AEB877"/><stop offset="0.26" stop-color="#FFFBB1"/><stop offset="0.55" stop-color="#FFFBB1"/><stop offset="0.78" stop-color="#D8E983"/><stop offset="0.9" stop-color="#3D6649"/><stop offset="1" stop-color="#1A2E1A"/></linearGradient></defs><rect x="30" y="137" width="18" height="491" rx="9" fill="url(#sky)" stroke="#C5D4C1"/><rect x="66" y="137" width="330" height="84" rx="12" fill="#EDF4EB"/><circle cx="39" cy="179.0" r="6" fill="#4A7C59" stroke="#fff" stroke-width="2"/><line x1="46" y1="179.0" x2="66" y2="179.0" stroke="#C5D4C1" stroke-width="1.5"/><text x="80" y="161"><tspan class="bb">Fajr</tspan><tspan class="s" dx="6">(dawn prayer)</tspan></text><text class="s" x="80" y="183"><tspan x="80" dy="0">From the first light of dawn until</tspan><tspan x="80" dy="19">sunrise.</tspan></text><rect x="336" y="147" width="52" height="44" rx="10" fill="#4A7C59"/><text class="n" x="362" y="169" text-anchor="middle" style="font-size:20px">2</text><text x="362" y="184" text-anchor="middle" style="font-size:11px;fill:#fff">units</text><line x1="270" y1="247.5" x2="396" y2="247.5" stroke="#AEB877" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="39" cy="247.5" r="11" fill="#FFFBB1" stroke="#4A7C59" stroke-width="2"/><rect x="74" y="230.5" width="190" height="26" fill="#F7FAF6"/><text class="bb" x="78" y="248.5">Sunrise</text><text class="s" x="154" y="248.5">No prayer window.</text><rect x="66" y="274" width="330" height="84" rx="12" fill="#EDF4EB"/><circle cx="39" cy="316.0" r="6" fill="#4A7C59" stroke="#fff" stroke-width="2"/><line x1="46" y1="316.0" x2="66" y2="316.0" stroke="#C5D4C1" stroke-width="1.5"/><text x="80" y="298"><tspan class="bb">Dhuhr</tspan><tspan class="s" dx="6">(midday prayer)</tspan></text><text class="s" x="80" y="320"><tspan x="80" dy="0">From just after midday until Asr</tspan><tspan x="80" dy="19">begins.</tspan></text><rect x="336" y="284" width="52" height="44" rx="10" fill="#4A7C59"/><text class="n" x="362" y="306" text-anchor="middle" style="font-size:20px">4</text><text x="362" y="321" text-anchor="middle" style="font-size:11px;fill:#fff">units</text><rect x="66" y="364" width="330" height="84" rx="12" fill="#EDF4EB"/><circle cx="39" cy="406.0" r="6" fill="#4A7C59" stroke="#fff" stroke-width="2"/><line x1="46" y1="406.0" x2="66" y2="406.0" stroke="#C5D4C1" stroke-width="1.5"/><text x="80" y="388"><tspan class="bb">Asr</tspan><tspan class="s" dx="6">(afternoon prayer)</tspan></text><text class="s" x="80" y="410"><tspan x="80" dy="0">From mid-afternoon until the sun</tspan><tspan x="80" dy="19">turns yellow, before sunset.</tspan></text><rect x="336" y="374" width="52" height="44" rx="10" fill="#4A7C59"/><text class="n" x="362" y="396" text-anchor="middle" style="font-size:20px">4</text><text x="362" y="411" text-anchor="middle" style="font-size:11px;fill:#fff">units</text><rect x="66" y="454" width="330" height="84" rx="12" fill="#EDF4EB"/><circle cx="39" cy="496.0" r="6" fill="#4A7C59" stroke="#fff" stroke-width="2"/><line x1="46" y1="496.0" x2="66" y2="496.0" stroke="#C5D4C1" stroke-width="1.5"/><text x="80" y="478"><tspan class="bb">Maghrib</tspan><tspan class="s" dx="6">(sunset prayer)</tspan></text><text class="s" x="80" y="500"><tspan x="80" dy="0">From just after sunset until the</tspan><tspan x="80" dy="19">twilight glow is gone.</tspan></text><rect x="336" y="464" width="52" height="44" rx="10" fill="#4A7C59"/><text class="n" x="362" y="486" text-anchor="middle" style="font-size:20px">3</text><text x="362" y="501" text-anchor="middle" style="font-size:11px;fill:#fff">units</text><rect x="66" y="544" width="330" height="84" rx="12" fill="#EDF4EB"/><circle cx="39" cy="586.0" r="6" fill="#4A7C59" stroke="#fff" stroke-width="2"/><line x1="46" y1="586.0" x2="66" y2="586.0" stroke="#C5D4C1" stroke-width="1.5"/><text x="80" y="568"><tspan class="bb">Isha</tspan><tspan class="s" dx="6">(night prayer)</tspan></text><text class="s" x="80" y="590"><tspan x="80" dy="0">After the twilight has gone. Best</tspan><tspan x="80" dy="19">before the middle of the night.</tspan></text><rect x="336" y="554" width="52" height="44" rx="10" fill="#4A7C59"/><text class="n" x="362" y="576" text-anchor="middle" style="font-size:20px">4</text><text x="362" y="591" text-anchor="middle" style="font-size:11px;fill:#fff">units</text><text class="b" x="24" y="654"><tspan x="24" dy="0">Exact times change every day and from city to</tspan><tspan x="24" dy="22">city. The Prayer times page shows today's</tspan><tspan x="24" dy="22">times for your city.</tspan></text><text class="s" x="24" y="732"><tspan x="24" dy="0">Your masjid may show a later Asr time. Both methods</tspan><tspan x="24" dy="19">are valid. In summer in much of Canada, Fajr and</tspan><tspan x="24" dy="19">Isha use adjusted times, so follow the tool or your</tspan><tspan x="24" dy="19">masjid.</tspan></text><text class="s" x="24" y="812">Sahih Muslim 612a; Quran 4:103</text></svg>
