<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 850" role="img" aria-labelledby="title desc" lang="en"><title id="title">Washing before prayer (wudu) in eight steps</title><desc id="desc">Eight numbered steps of wudu: 1 set your intention in your heart; 2 say Bismillah; 3 wash both hands to the wrists; 4 rinse the mouth, then the nose; 5 wash the face; 6 wash the right arm then the left, through the elbow; 7 wipe the head, then the ears; 8 wash the right foot then the left, through the ankle. Face, arms, head and feet are named in Quran 5:6. Once is enough; three times is the Sunnah.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="850" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="848.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">Washing before prayer (wudu)</text><text class="s" x="24" y="81">Eight steps, in the order the wudu tool teaches.</text><circle cx="38" cy="126" r="14" fill="#4A7C59"/><text class="n" x="38" y="131" text-anchor="middle">1</text><text class="bb" x="64" y="131">Set your intention</text><text class="s" x="64" y="152">In your heart. Nothing is said aloud.</text><line x1="38" y1="144" x2="38" y2="173" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="193" r="14" fill="#4A7C59"/><text class="n" x="38" y="198" text-anchor="middle">2</text><text class="bb" x="64" y="198">Begin with Allah's name</text><text class="s" x="64" y="219">Say Bismillah. If you forget, carry on.</text><line x1="38" y1="211" x2="38" y2="240" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="260" r="14" fill="#4A7C59"/><text class="n" x="38" y="265" text-anchor="middle">3</text><text class="bb" x="64" y="265">Wash hands</text><text class="s" x="64" y="286"><tspan x="64" dy="0">Both hands up to the wrists, and between the</tspan><tspan x="64" dy="19">fingers.</tspan></text><line x1="38" y1="278" x2="38" y2="326" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="346" r="14" fill="#4A7C59"/><text class="n" x="38" y="351" text-anchor="middle">4</text><text class="bb" x="64" y="351">Rinse mouth and nose</text><text class="s" x="64" y="372">The mouth first, then gently the nose.</text><line x1="38" y1="364" x2="38" y2="393" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="413" r="14" fill="#4A7C59"/><text class="n" x="38" y="418" text-anchor="middle">5</text><text class="bb" x="64" y="418">Wash face</text><rect x="317.2" y="403" width="78.8" height="20" rx="10" fill="#D8E983"/><text class="s" x="356.6" y="417" text-anchor="middle" style="font-size:12px;fill:#1A2E1A">Quran 5:6</text><text class="s" x="64" y="439">From the hairline to the chin, and ear to ear.</text><line x1="38" y1="431" x2="38" y2="460" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="480" r="14" fill="#4A7C59"/><text class="n" x="38" y="485" text-anchor="middle">6</text><text class="bb" x="64" y="485">Wash arms</text><rect x="317.2" y="470" width="78.8" height="20" rx="10" fill="#D8E983"/><text class="s" x="356.6" y="484" text-anchor="middle" style="font-size:12px;fill:#1A2E1A">Quran 5:6</text><text class="s" x="64" y="506"><tspan x="64" dy="0">The right arm through the elbow, then the</tspan><tspan x="64" dy="19">left.</tspan></text><line x1="38" y1="498" x2="38" y2="546" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="566" r="14" fill="#4A7C59"/><text class="n" x="38" y="571" text-anchor="middle">7</text><text class="bb" x="64" y="571">Wipe head and ears</text><rect x="266.8" y="556" width="129.2" height="20" rx="10" fill="#D8E983"/><text class="s" x="331.4" y="570" text-anchor="middle" style="font-size:12px;fill:#1A2E1A">Quran 5:6 (head)</text><text class="s" x="64" y="592"><tspan x="64" dy="0">Wipe over the head with wet hands, then the</tspan><tspan x="64" dy="19">ears.</tspan></text><line x1="38" y1="584" x2="38" y2="632" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="652" r="14" fill="#4A7C59"/><text class="n" x="38" y="657" text-anchor="middle">8</text><text class="bb" x="64" y="657">Wash feet</text><rect x="317.2" y="642" width="78.8" height="20" rx="10" fill="#D8E983"/><text class="s" x="356.6" y="656" text-anchor="middle" style="font-size:12px;fill:#1A2E1A">Quran 5:6</text><text class="s" x="64" y="678"><tspan x="64" dy="0">The right foot through the ankle, then the</tspan><tspan x="64" dy="19">left.</tspan></text><rect x="24" y="726" width="372" height="52" rx="10" fill="#EDF4EB"/><path d="M0 -11C6 -3 8 1 8 4A8 8 0 0 1 -8 4C-8 1 -6 -3 0 -11Z" transform="translate(44 754) scale(1)" fill="#4A7C59"/><text class="b" x="64" y="748" style="font-size:15px"><tspan x="64" dy="0">Washing each part once is enough. Three</tspan><tspan x="64" dy="20">times is the Sunnah.</tspan></text><text class="s" x="24" y="804"><tspan x="24" dy="0">Small differences between schools are normal. Ask a</tspan><tspan x="24" dy="19">local teacher if a detail matters for you.</tspan></text></svg>
