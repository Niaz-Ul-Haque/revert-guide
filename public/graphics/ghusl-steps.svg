<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 745" role="img" aria-labelledby="title desc" lang="en"><title id="title">Full-body wash (ghusl) in five steps</title><desc id="desc">Five numbered steps of ghusl, the full-body wash: 1 set your intention; 2 wash the private areas if needed; 3 make wudu; 4 wash the head and hair roots; 5 wash the whole body so water reaches the skin everywhere, usually the right side first. When is ghusl needed: after marital intimacy or sexual discharge; after menstruation or postpartum bleeding ends; on entering Islam, where scholars differ on whether it is required or recommended.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="745" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="743.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">Full-body wash (ghusl)</text><text class="s" x="24" y="81">Five steps, in the order the ghusl tool teaches.</text><circle cx="38" cy="126" r="14" fill="#4A7C59"/><text class="n" x="38" y="131" text-anchor="middle">1</text><text class="bb" x="64" y="131">Set your intention</text><text class="s" x="64" y="152"><tspan x="64" dy="0">In your heart, a full wash for the sake of</tspan><tspan x="64" dy="19">Allah.</tspan></text><line x1="38" y1="144" x2="38" y2="192" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="212" r="14" fill="#4A7C59"/><text class="n" x="38" y="217" text-anchor="middle">2</text><text class="bb" x="64" y="217">Wash private areas if needed</text><text class="s" x="64" y="238">Clean what needs cleaning first, privately.</text><line x1="38" y1="230" x2="38" y2="259" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="279" r="14" fill="#4A7C59"/><text class="n" x="38" y="284" text-anchor="middle">3</text><text class="bb" x="64" y="284">Make wudu</text><text class="s" x="64" y="305">The same wudu you make for prayer.</text><line x1="38" y1="297" x2="38" y2="326" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="346" r="14" fill="#4A7C59"/><text class="n" x="38" y="351" text-anchor="middle">4</text><text class="bb" x="64" y="351">Wash head and hair roots</text><text class="s" x="64" y="372"><tspan x="64" dy="0">Get the water down to the scalp and the roots</tspan><tspan x="64" dy="19">of the hair.</tspan></text><line x1="38" y1="364" x2="38" y2="412" stroke="#A5C89E" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><circle cx="38" cy="432" r="14" fill="#4A7C59"/><text class="n" x="38" y="437" text-anchor="middle">5</text><text class="bb" x="64" y="437">Wash the whole body</text><text class="s" x="64" y="458"><tspan x="64" dy="0">So water reaches the skin everywhere, usually</tspan><tspan x="64" dy="19">the right side first, then the left.</tspan></text><rect x="24" y="506" width="372" height="169" rx="12" fill="#EDF4EB"/><text class="bb" x="40" y="534">When is ghusl needed?</text><path d="M0 -11C6 -3 8 1 8 4A8 8 0 0 1 -8 4C-8 1 -6 -3 0 -11Z" transform="translate(48 554) scale(0.6)" fill="#4A7C59"/><text class="s" x="62" y="558">After marital intimacy or sexual discharge.</text><path d="M0 -11C6 -3 8 1 8 4A8 8 0 0 1 -8 4C-8 1 -6 -3 0 -11Z" transform="translate(48 581) scale(0.6)" fill="#4A7C59"/><text class="s" x="62" y="585"><tspan x="62" dy="0">After menstruation or postpartum bleeding</tspan><tspan x="62" dy="19">ends.</tspan></text><path d="M0 -11C6 -3 8 1 8 4A8 8 0 0 1 -8 4C-8 1 -6 -3 0 -11Z" transform="translate(48 627) scale(0.6)" fill="#4A7C59"/><text class="s" x="62" y="631"><tspan x="62" dy="0">On entering Islam. Scholars differ on whether</tspan><tspan x="62" dy="19">it is required or recommended.</tspan></text><text class="s" x="24" y="699"><tspan x="24" dy="0">You can do it in an ordinary shower, as long as the</tspan><tspan x="24" dy="19">intention is there and water reaches everywhere.</tspan></text></svg>
