<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1017" role="img" aria-labelledby="title desc" lang="en"><title id="title">Rak'ah map and tashahhud</title><desc id="desc">Rak'ah map. Fajr: 2 rak'ahs, sit once at the end. Dhuhr: 4, sit after 2 and at the end. Asr: 4, sit after 2 and at the end. Maghrib: 3, sit after 2 and at the end. Isha: 4, sit after 2 and at the end. Rak'ahs 1 and 2 have Al-Fatihah and a short surah; rak'ahs 3 and 4 have Al-Fatihah only. The tashahhud in transliteration with its translation of meaning, from Sahih al-Bukhari 831. At the final sitting add the salawat, then end with salam.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="1017" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="1015.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">Rak'ah map: when to sit</text><text class="s" x="24" y="81"><tspan x="24" dy="0">Each dot is one rak'ah. The bar shows where you sit</tspan><tspan x="24" dy="19">for the tashahhud.</tspan></text><text class="bb" x="24" y="143">Fajr</text><circle cx="116" cy="137" r="13" fill="#4A7C59"/><text class="n" x="116" y="142" text-anchor="middle" style="fill:#fff">1</text><circle cx="160" cy="137" r="13" fill="#4A7C59"/><text class="n" x="160" y="142" text-anchor="middle" style="fill:#fff">2</text><rect x="177" y="122" width="6" height="30" rx="3" fill="#6B7A3D"/><text class="s" x="103" y="169">Sit once, at the end</text><text class="bb" x="24" y="205">Dhuhr</text><circle cx="116" cy="199" r="13" fill="#4A7C59"/><text class="n" x="116" y="204" text-anchor="middle" style="fill:#fff">1</text><circle cx="160" cy="199" r="13" fill="#4A7C59"/><text class="n" x="160" y="204" text-anchor="middle" style="fill:#fff">2</text><rect x="177" y="184" width="6" height="30" rx="3" fill="#6B7A3D"/><circle cx="204" cy="199" r="13" fill="#A5C89E"/><text class="n" x="204" y="204" text-anchor="middle" style="fill:#1A2E1A">3</text><circle cx="248" cy="199" r="13" fill="#A5C89E"/><text class="n" x="248" y="204" text-anchor="middle" style="fill:#1A2E1A">4</text><rect x="265" y="184" width="6" height="30" rx="3" fill="#6B7A3D"/><text class="s" x="103" y="231">Sit after 2 and at the end</text><text class="bb" x="24" y="267">Asr</text><circle cx="116" cy="261" r="13" fill="#4A7C59"/><text class="n" x="116" y="266" text-anchor="middle" style="fill:#fff">1</text><circle cx="160" cy="261" r="13" fill="#4A7C59"/><text class="n" x="160" y="266" text-anchor="middle" style="fill:#fff">2</text><rect x="177" y="246" width="6" height="30" rx="3" fill="#6B7A3D"/><circle cx="204" cy="261" r="13" fill="#A5C89E"/><text class="n" x="204" y="266" text-anchor="middle" style="fill:#1A2E1A">3</text><circle cx="248" cy="261" r="13" fill="#A5C89E"/><text class="n" x="248" y="266" text-anchor="middle" style="fill:#1A2E1A">4</text><rect x="265" y="246" width="6" height="30" rx="3" fill="#6B7A3D"/><text class="s" x="103" y="293">Sit after 2 and at the end</text><text class="bb" x="24" y="329">Maghrib</text><circle cx="116" cy="323" r="13" fill="#4A7C59"/><text class="n" x="116" y="328" text-anchor="middle" style="fill:#fff">1</text><circle cx="160" cy="323" r="13" fill="#4A7C59"/><text class="n" x="160" y="328" text-anchor="middle" style="fill:#fff">2</text><rect x="177" y="308" width="6" height="30" rx="3" fill="#6B7A3D"/><circle cx="204" cy="323" r="13" fill="#A5C89E"/><text class="n" x="204" y="328" text-anchor="middle" style="fill:#1A2E1A">3</text><rect x="221" y="308" width="6" height="30" rx="3" fill="#6B7A3D"/><text class="s" x="103" y="355">Sit after 2 and at the end</text><text class="bb" x="24" y="391">Isha</text><circle cx="116" cy="385" r="13" fill="#4A7C59"/><text class="n" x="116" y="390" text-anchor="middle" style="fill:#fff">1</text><circle cx="160" cy="385" r="13" fill="#4A7C59"/><text class="n" x="160" y="390" text-anchor="middle" style="fill:#fff">2</text><rect x="177" y="370" width="6" height="30" rx="3" fill="#6B7A3D"/><circle cx="204" cy="385" r="13" fill="#A5C89E"/><text class="n" x="204" y="390" text-anchor="middle" style="fill:#1A2E1A">3</text><circle cx="248" cy="385" r="13" fill="#A5C89E"/><text class="n" x="248" y="390" text-anchor="middle" style="fill:#1A2E1A">4</text><rect x="265" y="370" width="6" height="30" rx="3" fill="#6B7A3D"/><text class="s" x="103" y="417">Sit after 2 and at the end</text><circle cx="32" cy="447" r="8" fill="#4A7C59"/><text class="s" x="48" y="452">Rak'ah 1 and 2: Al-Fatihah and a short surah.</text><circle cx="32" cy="474" r="8" fill="#A5C89E"/><text class="s" x="48" y="479">Rak'ah 3 and 4: Al-Fatihah only.</text><rect x="29" y="492" width="6" height="18" rx="3" fill="#6B7A3D"/><text class="s" x="48" y="506">Sit for the tashahhud.</text><rect x="24" y="538" width="372" height="344" rx="12" fill="#EDF4EB"/><text class="bb" x="40" y="566">The tashahhud</text><text class="b i" x="40" y="590" style="font-size:15px"><tspan x="40" dy="0">At-tahiyyatu lillahi was-salawatu</tspan><tspan x="40" dy="20">wat-tayyibat. As-salamu 'alayka</tspan><tspan x="40" dy="20">ayyuhan-Nabiyyu wa rahmatullahi wa</tspan><tspan x="40" dy="20">barakatuh. As-salamu 'alayna wa 'ala</tspan><tspan x="40" dy="20">'ibadillahis-salihin. Ash-hadu an la ilaha</tspan><tspan x="40" dy="20">illallah, wa ash-hadu anna Muhammadan</tspan><tspan x="40" dy="20">'abduhu wa rasuluh.</tspan></text><text class="s" x="40" y="736" style="font-weight:600">Translation of meaning</text><text class="s" x="40" y="756"><tspan x="40" dy="0">All compliments, prayers and good things are</tspan><tspan x="40" dy="19">due to Allah. Peace be on you, O Prophet, and</tspan><tspan x="40" dy="19">Allah's mercy and blessings. Peace be on us and</tspan><tspan x="40" dy="19">on the righteous servants of Allah. I testify</tspan><tspan x="40" dy="19">that there is no god but Allah, and I testify</tspan><tspan x="40" dy="19">that Muhammad is His servant and Messenger.</tspan></text><text class="b" x="24" y="900"><tspan x="24" dy="0">At the final sitting, add the blessing on the</tspan><tspan x="24" dy="22">Prophet (salawat), then end with salam.</tspan></text><text class="s" x="24" y="950"><tspan x="24" dy="0">You may hear slightly different wordings. They come</tspan><tspan x="24" dy="19">from different narrations and are all accepted.</tspan><tspan x="24" dy="19">Sahih al-Bukhari 831.</tspan></text></svg>
