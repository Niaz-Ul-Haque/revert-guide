<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 785" role="img" aria-labelledby="title desc" lang="en"><title id="title">The five pillars of Islam</title><desc id="desc">A building with five columns. 1 Declaring faith (Shahada): there is no god but Allah, and Muhammad is His Messenger. 2 Prayer (Salah): five times a day. 3 Giving (Zakat): a yearly share of savings above a set amount, for those who have it. 4 Fasting in Ramadan (Sawm): dawn to sunset for one month, with exemptions. 5 Pilgrimage (Hajj): to Makkah, for those who are able. Pillar 1 is shaded as done, because the reader has said the Shahada, and pillar 2 has a dashed outline as the next step. A note links the Shahada to Salah: start here. Sources: Sahih al-Bukhari 8; Sahih Muslim 16a.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="785" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="783.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">The five pillars of Islam</text><text class="s" x="24" y="81">The five acts of worship that Islam is built on.</text><rect x="24" y="92" width="14" height="12" rx="2" fill="#FFFBB1" stroke="#4A7C59" stroke-width="1.5"/><text class="s" x="44" y="102" style="font-size:13px">Done: you have said the Shahada</text><rect x="252" y="92" width="14" height="12" rx="2" fill="#EDF4EB" stroke="#4A7C59" stroke-width="2" stroke-dasharray="4 2"/><text class="s" x="272" y="102" style="font-size:13px">Next: prayer (salah)</text><path d="M44 148 L210.0 114 L376 148 Z" fill="#4A7C59"/><rect x="48" y="150" width="324" height="8" fill="#3D6649"/><rect x="71.2" y="162" width="28" height="62" rx="3" fill="#FFFBB1" stroke="#4A7C59" stroke-width="1.5"/><text class="bb" x="85.2" y="199" text-anchor="middle">1</text><rect x="133.6" y="162" width="28" height="62" rx="3" fill="#EDF4EB" stroke="#4A7C59" stroke-width="3" stroke-dasharray="5 3"/><text class="bb" x="147.6" y="199" text-anchor="middle">2</text><rect x="196.0" y="162" width="28" height="62" rx="3" fill="#EDF4EB" stroke="#4A7C59" stroke-width="1.5"/><text class="bb" x="210.0" y="199" text-anchor="middle">3</text><rect x="258.4" y="162" width="28" height="62" rx="3" fill="#EDF4EB" stroke="#4A7C59" stroke-width="1.5"/><text class="bb" x="272.4" y="199" text-anchor="middle">4</text><rect x="320.8" y="162" width="28" height="62" rx="3" fill="#EDF4EB" stroke="#4A7C59" stroke-width="1.5"/><text class="bb" x="334.8" y="199" text-anchor="middle">5</text><rect x="44" y="226" width="332" height="10" fill="#3D6649"/><circle cx="38" cy="251" r="14" fill="#4A7C59"/><text class="n" x="38" y="256" text-anchor="middle">1</text><text class="bb" x="64" y="256">Declaring faith (Shahada)</text><text class="s" x="64" y="278"><tspan x="64" dy="0">"There is no god but Allah, and Muhammad is</tspan><tspan x="64" dy="19">His Messenger."</tspan></text><rect x="60" y="324" width="336" height="54" rx="10" fill="#FFFBB1" stroke="#AEB877" stroke-width="1.5"/><path d="M38 318 V382 M32 376 L38 382 L44 376" fill="none" stroke="#4A7C59" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="b" x="72" y="344" style="font-size:14px;font-weight:600"><tspan x="72" dy="0">You have said the Shahada. Salah is how you</tspan><tspan x="72" dy="19">live it every day. Start here.</tspan></text><circle cx="38" cy="397" r="14" fill="#4A7C59"/><text class="n" x="38" y="402" text-anchor="middle">2</text><text class="bb" x="64" y="402">Prayer (Salah)</text><text class="s" x="64" y="424">Five times a day.</text><circle cx="38" cy="452" r="14" fill="#4A7C59"/><text class="n" x="38" y="457" text-anchor="middle">3</text><text class="bb" x="64" y="457">Giving (Zakat)</text><text class="s" x="64" y="479"><tspan x="64" dy="0">A yearly share of savings above a set amount,</tspan><tspan x="64" dy="19">for those who have it.</tspan></text><circle cx="38" cy="526" r="14" fill="#4A7C59"/><text class="n" x="38" y="531" text-anchor="middle">4</text><text class="bb" x="64" y="531">Fasting in Ramadan (Sawm)</text><text class="s" x="64" y="553"><tspan x="64" dy="0">Dawn to sunset for one month. Illness, travel</tspan><tspan x="64" dy="19">and some other situations are exempt.</tspan></text><circle cx="38" cy="600" r="14" fill="#4A7C59"/><text class="n" x="38" y="605" text-anchor="middle">5</text><text class="bb" x="64" y="605">Pilgrimage (Hajj)</text><text class="s" x="64" y="627">To Makkah, for those who are able.</text><line x1="24" y1="662" x2="396" y2="662" stroke="#C5D4C1" stroke-width="1.5"/><text class="b" x="24" y="686"><tspan x="24" dy="0">You do not have to do all five on day one.</tspan><tspan x="24" dy="22">Most of them come later, or only if you are</tspan><tspan x="24" dy="22">able.</tspan></text><text class="s" x="24" y="756">Sahih al-Bukhari 8; Sahih Muslim 16a</text></svg>
