<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 616" role="img" aria-labelledby="title desc" lang="en"><title id="title">What breaks wudu</title><desc id="desc">Two columns. Agreed by all: using the toilet, passing wind, deep sleep, losing consciousness. Differs by school: bleeding or vomiting (breaks it in the Hanafi school); touching the private parts (Shafi'i and Hanbali); eating camel meat (Hanbali). A doubt does not break wudu: it stays valid until you are sure. When wudu breaks, make it again before your next prayer.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="616" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="614.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">What breaks wudu</text><text class="s" x="24" y="81"><tspan x="24" dy="0">Some things break wudu for everyone. Others depend</tspan><tspan x="24" dy="19">on the school you follow.</tspan></text><rect x="24" y="129" width="180.0" height="320" rx="12" fill="#EDF4EB"/><text class="bb" x="38" y="155">Agreed by all</text><circle cx="40" cy="178" r="5" fill="#4A7C59"/><text class="s" x="54" y="183"><tspan x="54" dy="0">Using the toilet</tspan><tspan x="54" dy="19">(urine or stool)</tspan></text><circle cx="40" cy="228" r="5" fill="#4A7C59"/><text class="s" x="54" y="233">Passing wind</text><circle cx="40" cy="259" r="5" fill="#4A7C59"/><text class="s" x="54" y="264">Deep sleep</text><circle cx="40" cy="290" r="5" fill="#4A7C59"/><text class="s" x="54" y="295"><tspan x="54" dy="0">Losing</tspan><tspan x="54" dy="19">consciousness</tspan></text><rect x="216.0" y="129" width="180.0" height="320" rx="12" fill="#FFFBB1"/><text class="bb" x="230.0" y="155">Differs by school</text><circle cx="232.0" cy="178" r="4.5" fill="none" stroke="#4A7C59" stroke-width="2"/><text class="s" x="246.0" y="183"><tspan x="246.0" dy="0">Bleeding or</tspan><tspan x="246.0" dy="19">vomiting (breaks it</tspan><tspan x="246.0" dy="19">in the Hanafi</tspan><tspan x="246.0" dy="19">school)</tspan></text><circle cx="232.0" cy="266" r="4.5" fill="none" stroke="#4A7C59" stroke-width="2"/><text class="s" x="246.0" y="271"><tspan x="246.0" dy="0">Touching the</tspan><tspan x="246.0" dy="19">private parts</tspan><tspan x="246.0" dy="19">(breaks it for</tspan><tspan x="246.0" dy="19">Shafi'i and</tspan><tspan x="246.0" dy="19">Hanbali)</tspan></text><circle cx="232.0" cy="373" r="4.5" fill="none" stroke="#4A7C59" stroke-width="2"/><text class="s" x="246.0" y="378"><tspan x="246.0" dy="0">Eating camel meat</tspan><tspan x="246.0" dy="19">(breaks it for</tspan><tspan x="246.0" dy="19">Hanbali)</tspan></text><text class="b" x="24" y="473"><tspan x="24" dy="0">A doubt does not break wudu. If you are not</tspan><tspan x="24" dy="22">sure you passed wind, your wudu stays valid</tspan><tspan x="24" dy="22">until you are sure.</tspan></text><text class="s" x="24" y="549"><tspan x="24" dy="0">When wudu breaks, make it again before your next</tspan><tspan x="24" dy="19">prayer. If a school detail comes up often for you,</tspan><tspan x="24" dy="19">ask a local teacher.</tspan></text></svg>
