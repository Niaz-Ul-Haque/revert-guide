<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 925" role="img" aria-labelledby="title desc" lang="en"><title id="title">My first Ramadan checklist</title><desc id="desc">A checklist with empty tick boxes. Before Ramadan: ask your masjid how they announce the start; learn the basics, no food, drink or sexual intercourse from dawn to sunset; know who is excused, and ask about your own case. Each day: eat something at suhoor; break the fast soon after sunset with water or dates; pick one small act of worship. Along the way: try taraweeh once if you like, it is optional; tell one person how it is going. Missing a day or struggling does not undo your Ramadan. Allah wants ease for you.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="925" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="923.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">My first Ramadan</text><text class="s" x="24" y="81"><tspan x="24" dy="0">A gentle checklist. Tick what helps and leave the</tspan><tspan x="24" dy="19">rest.</tspan></text><path d="M24 153 V139.3 Q24 134.05 31.0 133 Q38 134.05 38 139.3 V153 Z" fill="#4A7C59"/><text class="bb" x="48" y="150" style="font-size:17px">Before Ramadan</text><rect x="24" y="165" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="175" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="190" style="font-size:15px"><tspan x="68" dy="0">Ask your masjid how they announce the</tspan><tspan x="68" dy="20">start of Ramadan.</tspan></text><rect x="24" y="231" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="241" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="256" style="font-size:15px"><tspan x="68" dy="0">Learn the basics: no food, drink or</tspan><tspan x="68" dy="20">sexual intercourse from dawn to sunset.</tspan></text><rect x="24" y="297" width="372" height="98" rx="10" fill="#EDF4EB"/><rect x="36" y="307" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="322" style="font-size:15px"><tspan x="68" dy="0">Know who is excused. Illness, travel and</tspan><tspan x="68" dy="20">periods change fasting, and missed days</tspan><tspan x="68" dy="20">are made up later. Ask about your own</tspan><tspan x="68" dy="20">case.</tspan></text><path d="M24 427 V413.3 Q24 408.05 31.0 407 Q38 408.05 38 413.3 V427 Z" fill="#4A7C59"/><text class="bb" x="48" y="424" style="font-size:17px">Each day</text><rect x="24" y="439" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="449" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="464" style="font-size:15px"><tspan x="68" dy="0">Eat something at suhoor before dawn, even</tspan><tspan x="68" dy="20">a little.</tspan></text><rect x="24" y="505" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="515" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="530" style="font-size:15px"><tspan x="68" dy="0">Break the fast soon after sunset, with</tspan><tspan x="68" dy="20">water or dates.</tspan></text><rect x="24" y="571" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="581" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="596" style="font-size:15px"><tspan x="68" dy="0">Pick one small act of worship you can</tspan><tspan x="68" dy="20">keep, like a page of Quran or one dua.</tspan></text><path d="M24 661 V647.3 Q24 642.05 31.0 641 Q38 642.05 38 647.3 V661 Z" fill="#4A7C59"/><text class="bb" x="48" y="658" style="font-size:17px">Along the way</text><rect x="24" y="673" width="372" height="58" rx="10" fill="#EDF4EB"/><rect x="36" y="683" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="698" style="font-size:15px"><tspan x="68" dy="0">Try taraweeh once if you like. It is</tspan><tspan x="68" dy="20">optional.</tspan></text><rect x="24" y="739" width="372" height="38" rx="10" fill="#EDF4EB"/><rect x="36" y="749" width="20" height="20" rx="4" fill="#fff" stroke="#4A7C59" stroke-width="2"/><text class="b" x="68" y="764" style="font-size:15px">Tell one person how it is going.</text><rect x="24" y="789" width="372" height="68" rx="12" fill="#FFFBB1" stroke="#AEB877" stroke-width="1.5"/><text class="bb" x="40" y="819"><tspan x="40" dy="0">Missing a day or struggling does not undo</tspan><tspan x="40" dy="22">your Ramadan. Allah wants ease for you.</tspan></text><text class="s" x="24" y="877"><tspan x="24" dy="0">Quran 2:183 to 2:187; Sahih al-Bukhari 1923 and</tspan><tspan x="24" dy="19">1957; Sunan Abi Dawud 2356</tspan></text></svg>
