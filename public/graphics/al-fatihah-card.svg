<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1215" role="img" aria-labelledby="title desc" lang="en"><title id="title">Al-Fatihah learning card</title><desc id="desc">The seven verses of Al-Fatihah in Arabic, transliteration and translation of meaning (The Clear Quran). 1 Bismillahir-Rahmanir-Rahim: In the Name of Allah, the Most Compassionate, Most Merciful. 2 Alhamdu lillahi Rabbil-'alamin: All praise is for Allah, Lord of all worlds. 3 Ar-Rahmanir-Rahim: the Most Compassionate, Most Merciful. 4 Maliki yawmid-din: Master of the Day of Judgment. 5 Iyyaka na'budu wa iyyaka nasta'in: You alone we worship and You alone we ask for help. 6 Ihdinas-siratal-mustaqim: Guide us along the Straight Path. 7 Siratal-ladhina an'amta 'alayhim ghayril-maghdubi 'alayhim wa lad-dallin: the Path of those You have blessed, not those You are displeased with, or those who are astray.</desc><style>text{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;fill:#1A2E1A}.h{font-size:22px;font-weight:700}.b{font-size:16px}.bb{font-size:16px;font-weight:600}.s{font-size:14px;fill:#4A5D4A}.i{font-style:italic}.n{font-size:15px;font-weight:700;fill:#fff}.ar{font-family:Amiri,'Noto Naskh Arabic','Traditional Arabic','Times New Roman',serif;font-size:22px}</style><rect width="420" height="1215" rx="16" fill="#F7FAF6"/><rect x="0.75" y="0.75" width="418.5" height="1213.5" rx="15.5" fill="none" stroke="#C5D4C1" stroke-width="1.5"/><path d="M24 52 V31.9 Q24 23.65 35.0 22 Q46 23.65 46 31.9 V52 Z" fill="#4A7C59"/><text class="h" x="58" y="45">Al-Fatihah (The Opening)</text><text class="s" x="24" y="81"><tspan x="24" dy="0">Recited in every rak'ah. Learn it one line at a</tspan><tspan x="24" dy="19">time.</tspan></text><text class="ar" x="230.0" y="159" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text><text class="b i" x="64" y="193" style="font-size:15px">Bismillahir-Rahmanir-Rahim.</text><text class="s" x="64" y="214"><tspan x="64" dy="0">In the Name of Allah, the Most Compassionate,</tspan><tspan x="64" dy="19">Most Merciful.</tspan></text><circle cx="38" cy="151" r="14" fill="#4A7C59"/><text class="n" x="38" y="156" text-anchor="middle">1</text><line x1="64" y1="260" x2="396" y2="260" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="292" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ</text><text class="b i" x="64" y="326" style="font-size:15px">Alhamdu lillahi Rabbil-'alamin.</text><text class="s" x="64" y="347">All praise is for Allah, Lord of all worlds,</text><circle cx="38" cy="284" r="14" fill="#4A7C59"/><text class="n" x="38" y="289" text-anchor="middle">2</text><line x1="64" y1="374" x2="396" y2="374" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="406" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">الرَّحْمَٰنِ الرَّحِيمِ</text><text class="b i" x="64" y="440" style="font-size:15px">Ar-Rahmanir-Rahim.</text><text class="s" x="64" y="461">the Most Compassionate, Most Merciful,</text><circle cx="38" cy="398" r="14" fill="#4A7C59"/><text class="n" x="38" y="403" text-anchor="middle">3</text><line x1="64" y1="488" x2="396" y2="488" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="520" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">مَالِكِ يَوْمِ الدِّينِ</text><text class="b i" x="64" y="554" style="font-size:15px">Maliki yawmid-din.</text><text class="s" x="64" y="575">Master of the Day of Judgment.</text><circle cx="38" cy="512" r="14" fill="#4A7C59"/><text class="n" x="38" y="517" text-anchor="middle">4</text><line x1="64" y1="602" x2="396" y2="602" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="634" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ</text><text class="b i" x="64" y="668" style="font-size:15px">Iyyaka na'budu wa iyyaka nasta'in.</text><text class="s" x="64" y="689"><tspan x="64" dy="0">You (alone) we worship and You (alone) we ask</tspan><tspan x="64" dy="19">for help.</tspan></text><circle cx="38" cy="626" r="14" fill="#4A7C59"/><text class="n" x="38" y="631" text-anchor="middle">5</text><line x1="64" y1="735" x2="396" y2="735" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="767" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ</text><text class="b i" x="64" y="801" style="font-size:15px">Ihdinas-siratal-mustaqim.</text><text class="s" x="64" y="822">Guide us along the Straight Path,</text><circle cx="38" cy="759" r="14" fill="#4A7C59"/><text class="n" x="38" y="764" text-anchor="middle">6</text><line x1="64" y1="849" x2="396" y2="849" stroke="#C5D4C1" stroke-width="1"/><text class="ar" x="230.0" y="881" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ</text><text class="ar" x="230.0" y="915" text-anchor="middle" direction="rtl" xml:lang="ar" lang="ar">غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ</text><text class="b i" x="64" y="949" style="font-size:15px"><tspan x="64" dy="0">Siratal-ladhina an'amta 'alayhim</tspan><tspan x="64" dy="19">ghayril-maghdubi 'alayhim wa lad-dallin.</tspan></text><text class="s" x="64" y="989"><tspan x="64" dy="0">the Path of those You have blessed, not those</tspan><tspan x="64" dy="19">You are displeased with, or those who are</tspan><tspan x="64" dy="19">astray.</tspan></text><circle cx="38" cy="873" r="14" fill="#4A7C59"/><text class="n" x="38" y="878" text-anchor="middle">7</text><rect x="24" y="1062" width="372" height="77" rx="10" fill="#EDF4EB"/><text class="s" x="38" y="1086"><tspan x="38" dy="0">Translation of meaning: The Clear Quran (Dr.</tspan><tspan x="38" dy="19">Mustafa Khattab), via Quran.com. Punctuation</tspan><tspan x="38" dy="19">simplified.</tspan></text><text class="b" x="24" y="1161"><tspan x="24" dy="0">While you learn, pray with what you know and</tspan><tspan x="24" dy="22">ask a teacher.</tspan></text></svg>
